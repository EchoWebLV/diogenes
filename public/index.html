<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>groklius // rack</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="scan" aria-hidden="true"></div>
    <div id="boot" class="boot"></div>

    <div class="rack">
      <pre class="bar" id="bar"></pre>

      <section class="pane view">
        <pre class="frame" id="view-chrome"></pre>
        <div class="viewport">
          <img id="live-frame" alt="live browser" hidden />
          <pre class="body" id="view"></pre>
        </div>
      </section>

      <section class="pane stream">
        <pre class="frame" id="stream-chrome"></pre>
        <div class="filters" id="tabs"></div>
        <p class="hint" id="filter-hint">click a filter · click a line to read it</p>
        <ol id="stream"></ol>
      </section>

      <section class="pane vitals">
        <pre id="vitals"></pre>
      </section>
    </div>

    <div id="overlay" class="overlay" hidden>
      <pre class="overlay-head" id="overlay-head"></pre>
      <pre class="overlay-body" id="overlay-body"></pre>
      <pre class="overlay-foot">[esc] close   [j/k] move   [1-9] mark link   [c] copy wallet</pre>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
