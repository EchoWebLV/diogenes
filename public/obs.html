<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>groklius // obs</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ff4d1a; font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; }
      img { width: 100%; height: 100%; object-fit: contain; background: #000; }
      .ticker {
        position: absolute; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,.72); padding: 10px 16px; font-size: 18px;
      }
      .live { color: #ff4d1a; }
    </style>
  </head>
  <body>
    <img id="frame" alt="browser" src="/api/frame.mjpeg" />
    <div class="ticker"><span class="live">● groklius</span> <span id="line">waiting for the browser</span></div>
    <script>
      async function tick() {
        try {
          const s = await fetch("/api/state", { cache: "no-store" }).then((r) => r.json());
          const ev = (s.events || []).at(-1);
          const url = s.browser?.url || s.lantern?.url || "";
          document.getElementById("line").textContent =
            `${s.status || ""}  ${url}  ${ev ? ev.kind + " " + (ev.text || "").slice(0, 80) : ""}`;
        } catch {}
      }
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
